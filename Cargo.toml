[workspace]
members = ["dprint-crates/core"]

[workspace.dependencies]
anyhow = "1.0.64"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.1.0", features = ["serde"] }
tokio = "1.32"

[package]
name = "dprint-plugin-typescript"
version = "0.95.15"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-typescript"
keywords = ["formatting", "formatter", "typescript", "javascript"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-typescript"
description = "TypeScript and JavaScript code formatter."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]
tracing = ["dprint-core/tracing"]

[[test]]
name = "specs"
path = "tests/spec_test.rs"
harness = false

[dependencies]
anyhow.workspace = true
capacity_builder = "0.5.0"
deno_ast = { version = "0.53.0", features = ["view"] }
dprint-core = { path = "dprint-crates/core", features = ["formatting"] }
dprint-core-macros = "0.1.0"
percent-encoding = "2.3.1"
rustc-hash = "2.1.1"
serde.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
dprint-development = "0.10.1"
dprint-plugin-sql = "0.2.0"
malva = "0.11.2"
markup_fmt = "0.19.0"
pretty_assertions = "1.3.0"
serde_json = { workspace = true }
